version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: saathi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saathi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saathi_password}
      POSTGRES_DB: ${POSTGRES_DB:-saathi_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-saathi_user} -d ${POSTGRES_DB:-saathi_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: saathi-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-saathi_user}:${POSTGRES_PASSWORD:-saathi_password}@postgres:5432/${POSTGRES_DB:-saathi_db}?schema=public
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: default_access_secret_change_in_production_32char_minimum
      JWT_REFRESH_SECRET: default_refresh_secret_change_in_production_32char_minimum
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: saathi-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:4000/api/v1

volumes:
  postgres_data:
