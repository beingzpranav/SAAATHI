services:
  - type: web
    name: saathi-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace=@saathi/shared && npm run build --workspace=@saathi/api
    startCommand: npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate && npm run start --workspace=@saathi/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_BASE_URL
        value: https://saathi-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://saathi-web-j2qr.onrender.com,http://localhost:3000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: TRANSLATION_SERVICE_URL
        value: http://localhost:8000
      - key: TRANSLATION_INTERNAL_SECRET
        sync: false

  - type: web
    name: saathi-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace=@saathi/shared && npm run build --workspace=@saathi/web
    staticPublishPath: ./apps/web/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://saathi-api.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://saathi-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
