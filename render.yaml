services:
  - type: web
    name: saathi-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_BASE_URL
        value: https://saathi-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: saathi-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://saathi-web.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: TRANSLATION_SERVICE_URL
        value: http://localhost:8000
      - key: TRANSLATION_INTERNAL_SECRET
        sync: false

  - type: static
    name: saathi-web
    buildCommand: npm ci && npm run build --workspace=@saathi/shared && npm run build --workspace=@saathi/web
    staticPublishPath: ./apps/web/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://saathi-api.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://saathi-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: saathi-db
    databaseName: saathi_db
    user: saathi_user
    plan: free
